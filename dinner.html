{id:18,name:"玉米胡萝卜排骨汤",category:"汤汤水水",price:25,time:"约 50 分钟",desc:"清甜鲜香，慢慢煲一锅",emoji:"🍲",art:"#eee3d1",tag:"暖心汤",image:"https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=85"}
];
let category="全部", selectedId=null;
try{selectedId=Number(localStorage.getItem("dinner-selected"))||null}catch(e){}
const list=document.getElementById("dishList"), search=document.getElementById("search");
function render(){
 const q=search.value.trim().toLowerCase();
 const visible=dishes.filter(d=>(category==="全部"||d.category===category)&&(!q||(d.name+" "+d.desc+" "+d.category).toLowerCase().includes(q)));
 document.getElementById("dishCount").textContent=visible.length+" 道可选";
 if(!visible.length){list.innerHTML='<div class="empty">没有找到这道菜，换个关键词试试吧。</div>';return}
 list.innerHTML=visible.map(d=>'<button type="button" class="dish '+(selectedId===d.id?'selected':'')+'" data-id="'+d.id+'" aria-pressed="'+(selectedId===d.id)+'"><div class="dish-art"><img class="dish-photo" src="'+d.image+'" alt="'+d.name+'实物菜品照片" loading="lazy"><span class="tag">'+d.tag+'</span><span class="check">✓</span></div><h3>'+d.name+'</h3><p class="dish-desc">'+d.desc+'</p><div class="dish-meta"><span class="price">¥'+d.price+' <small>左右</small></span><span class="time">'+d.time+'</span></div></button>').join("");
 list.querySelectorAll(".dish").forEach(el=>el.addEventListener("click",()=>choose(Number(el.dataset.id))));list.querySelectorAll(".dish-photo").forEach(img=>img.addEventListener("error",()=>{img.onerror=null;img.src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=900&q=80"}));
}
function choose(id){selectedId=id;try{localStorage.setItem("dinner-selected",String(id))}catch(e){}render();updateBar()}
function updateBar(){const d=dishes.find(x=>x.id===selectedId);document.getElementById("chosenName").textContent=d?d.name:"还没选好呢";document.getElementById("chosenPrice").textContent=d?"预计食材 ¥"+d.price+" · "+d.time:"点一道喜欢的菜吧";document.getElementById("confirm").disabled=!d}
document.getElementById("filters").querySelectorAll("button").forEach(btn=>btn.addEventListener("click",()=>{category=btn.dataset.category;document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b===btn));render()}));
search.addEventListener("input",render);
document.getElementById("confirm").addEventListener("click",()=>{const d=dishes.find(x=>x.id===selectedId);if(!d)return;document.getElementById("modalEmoji").src=d.image;document.getElementById("modalEmoji").alt=d.name;document.getElementById("modalDish").textContent=d.name;document.getElementById("modalDetails").textContent="预计食材 ¥"+d.price+" · "+d.time;document.getElementById("modalBackdrop").classList.add("show")});
document.getElementById("backBtn").addEventListener("click",()=>document.getElementById("modalBackdrop").classList.remove("show"));
document.getElementById("modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")e.currentTarget.classList.remove("show")});
document.getElementById("shareBtn").addEventListener("click",async()=>{const d=dishes.find(x=>x.id===selectedId);if(!d)return;const message="今晚想吃「"+d.name+"」！\n预计食材 ¥"+d.price+" 左右，"+d.time+"。\n我从专属晚餐小菜单里选的，今晚好好吃饭呀 ♡\n"+location.href;try{if(navigator.share){await navigator.share({title:"今晚就吃这个！",text:message,url:location.href})}else if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(message);alert("晚餐小纸条已复制，发给另一半吧 ♡")}else{window.prompt("复制这份晚餐小纸条，发给另一半吧：",message)}}catch(e){if(e.name!=="AbortError")window.prompt("复制这份晚餐小纸条：",message)}});
render();updateBar();
</script>
</body>
</html>
