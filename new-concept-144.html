<style>

radius:99px;font-size:11px}.cols{display:grid;grid-template-columns:1.3fr .7fr;gap:14px;margin-top:16px}.block{background:#f8faff;border:1px solid #edf2fa;border-radius:13px;padding:15px;margin-bottom:12px}.block h3{font-size:14px;margin:0 0 8px}.block p{margin:5px 0;color:#52627b;font-size:13px}.example,.word{background:white;border:1px solid #e7edf7;border-radius:10px;padding:10px 12px;margin:8px 0}.en{font-weight:700;color:#285fae}.zh{font-size:12px;color:#71809a}.grammar{font-size:11px;color:#8b98aa;margin-top:4px}.wordrow{display:flex;justify-content:space-between;gap:8px}.word b{color:#285fae}.answer{margin-top:7px;color:#267b62;font-size:12px}details summary{cursor:pointer;color:#315f9e;font-size:13px;font-weight:650}.btn{border:0;border-radius:10px;background:var(--blue);color:white;padding:9px 13px;cursor:pointer}.secondary{background:white;border:1px solid var(--line);color:#60708a}.empty{color:var(--muted);padding:24px}.hide{display:none!important}@media(max-width:760px){.layout{display:block}.side{height:auto;position:relative;padding:12px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:4px 6px 9px}.side nav{display:flex;overflow:auto;gap:4px}.nav{white-space:nowrap;width:auto;padding:7px 10px}main{padding:15px}.hero h1{font-size:25px}.grid,.cols{grid-template-columns:1fr}}
</style></head><body><div class="layout"><aside class="side"><div class="brand">新概念英语 · 第一册<small>LESSON NOTES / BEGINNER</small></div><nav id="nav"></nav></aside><main><section class="hero"><small>FIRST THINGS FIRST · BOOK 1</small><h1>前10课 · 逐课精讲</h1><p>每课包含核心语法、大白话解释、句型结构、例句精讲、重点词汇、易错点和自测题。点击左侧课次开始学习。</p></section><div class="bar"><input class="search" id="search" placeholder="搜索课次、单词或语法点…"><button class="btn secondary" id="all">显示全部课程</button></div><div id="list" class="grid"></div><div id="detail"></div></main></div>
<script>
const lessons=[
{n:1,title:"Excuse me!",cn:"对不起！/ 劳驾！",kind:"be动词 · this · my/your",focus:"打招呼；Excuse me / Pardon；指示代词 this；be 动词 is；形容词性物主限定词 my / your。",explain:"这一课学会礼貌地叫住别人，并询问某件东西是不是对方的。this 表示“这个”，your 表示“你的”，handbag 是名词。把 is 放到 this 前面，就构成一般疑问句。",form:"陈述句：This is my handbag.（这是我的手提包。）\n一般疑问句：Is this your handbag?（这是你的手提包吗？）\n肯定回答：Yes, it is.（是的。）\n否定回答：No, it isn't.（不，不是。）",pattern:"Is this your …? — Yes, it is. / No, it isn't.",examples:[["Excuse me. Is this your handbag?","打扰一下。这是你的手提包吗？","Excuse me 用来礼貌地引起别人注意。"],["Yes, it is. Thank you very much.","是的，是我的。非常感谢。","Yes, it is 是 Is this…? 的简短肯定回答。"],["Is this your book? — No, it isn't.","这是你的书吗？——不，不是。","Is + this + your + 单数名词？"]],words:[["excuse","原谅；打扰","Excuse me."],["me","我（宾格）","Look at me."],["this","这个","This is my book."],["is","是（be动词）","This is a pen."],["your","你的；你们的","Is this your coat?"],["handbag","手提包","This is my handbag."],["pardon","请再说一遍；原谅","Pardon?"],["thank you","谢谢你","Thank you very much."],["very much","非常；很","I like it very much."]],mistake:"① Is this…? 的简短回答用 it：Yes, it is. 不说 Yes, this is.\n② your 后面要接名词：your handbag。\n③ Excuse me 用于礼貌打断或引起注意；Sorry 常用于表达歉意。",quiz:[["把 This is your handbag. 变成一般疑问句。","Is this your handbag?"],["补全：— Is this your pen? — Yes, ____ ____.","it is"],["翻译：打扰一下，这是你的书吗？","Excuse me. Is this your book?"]]},
{n:2,title:"Is this your…?",cn:"这是你的……吗？",kind:"一般疑问句 · 简短回答",focus:"复习 Is this…?；名词与物品名称；Yes / No 简短回答；my / your。",explain:"第二课主要把第一课的问答练熟。把 handbag 换成 pen、pencil、book、watch 等物品，就能用同一个句型问“这是你的……吗？”。",form:"Is this your + 单数物品？\nYes, it is. / No, it isn't.\nthis 指一个东西，所以搭配 is；回答时用 it 代替 this。",pattern:"Is this your …? — Yes, it is. / No, it isn't.",examples:[["Is this your pen? — Yes, it is.","这是你的钢笔吗？——是的。","Is + this + your + 单数名词？"],["Is this your pencil? — No, it isn't.","这是你的铅笔吗？——不，不是。","否定回答：No, it isn't."],["Is this your watch? — Yes, it is.","这是你的手表吗？——是的。","替换物品名词，句型不变。"]],words:[["pen","钢笔","This is my pen."],["pencil","铅笔","Is this your pencil?"],["book","书","This is a book."],["watch","手表","Is this your watch?"],["coat","外套；大衣","This is my coat."],["dress","连衣裙","Is this your dress?"],["skirt","短裙","This is her skirt."],["shirt","衬衫","Is this your shirt?"],["car","汽车","Is this your car?"],["house","房子","This is my house."]],mistake:"① this 后面用 is。② your 后面必须跟名词。③ 不要回答 Yes, this is；简短回答用 Yes, it is。",quiz:[["用 book 替换 handbag：Is this your handbag?","Is this your book?"],["补全：— Is this your coat? — No, ____ ____.","it isn't"],["翻译：这是你的手表吗？","Is this your watch?"]]},
{n:3,title:"Sorry, sir.",cn:"对不起，先生。",kind:"Here is · 否定句",focus:"This is not…；Here is… / Here's…；礼貌表达；物品词汇。",explain:"This is not… 表示“这不是……”，把 not 放在 be 动词 is 后面。Here is… 可以理解成“东西在这儿”或“给你……”，常用于把东西递给别人。Here's 是 Here is 的缩写。",form:"This is not my umbrella.（这不是我的雨伞。）\nHere is your ticket. = Here's your ticket.（这是你的票/给你票。）\nis not = isn't。",pattern:"This is not … . / Here is your … .",examples:[["This is not my umbrella.","这不是我的雨伞。","否定句：be 动词后加 not。"],["Here is your ticket.","这是你的票。/ 给你票。","Here is + 单数名词。"],["Here's your coat.","这是你的外套。/ 给你外套。","Here's = Here is。"]],words:[["sorry","对不起","Sorry, sir."],["sir","先生","Good morning, sir."],["umbrella","雨伞","Here is your umbrella."],["ticket","票","Here's your ticket."],["here","这里","Come here, please."],["number","号码；数字","What's your number?"],["five","五","I have five books."],["please","请","Come in, please."]],mistake:"① 否定句在 is 后加 not：is not，也可缩写 isn't。\n② Here's 后面直接接名词。\n③ 单数名词用 Here is；复数名词通常用 Here are。",quiz:[["把 Here is your ticket. 缩写。","Here's your ticket."],["补全：This ____ not my bag.","is"],["翻译：给你，你的雨伞。","Here is your umbrella."]]},
{n:4,title:"Is this your…?",cn:"这是你的……吗？",kind:"综合问答 · it",focus:"综合复习 Is this…?、否定回答、Here is…；it 代替前文提到的单数物品。",explain:"这一课把前几课放进连续对话里：先询问是不是某人的，再确认物品，最后把东西递还给对方。it 可以代替前面已经提到的单数物品，避免反复说同一个名词。",form:"Is this your coat? — No, it isn't.\nIs this your umbrella? — Yes, it is.\nHere is your coat.\nit = 前文提到的那件东西。",pattern:"Is this your …? — Yes, it is. / No, it isn't.",examples:[["Is this your coat? — No, it isn't.","这是你的外套吗？——不，不是。","一般疑问句及否定回答。"],["Is this your umbrella? — Yes, it is.","这是你的雨伞吗？——是的。","肯定回答使用 it。"],["Here is your coat.","这是你的外套。/ 给你外套。","Here is + 单数名词。"]],words:[["coat","外套；大衣","Here is your coat."],["umbrella","雨伞","Is this your umbrella?"],["it","它；这件东西","Is this it?"],["yes","是的","Yes, it is."],["no","不；不是","No, it isn't."],["thank you","谢谢","Thank you."],["very much","非常","Thank you very much."]],mistake:"① it 可以代替前面提到的单数物品。\n② Is this it? 常表示“就是这个吗？”。\n③ 问句语序是 Is + 主语 + 其他？",quiz:[["把 No, this is not. 改成简短回答。","No, it isn't."],["翻译：给你，你的外套。","Here is your coat."],["补全：Yes, ____ ____.","it is"]]},
{n:5,title:"Nice to meet you.",cn:"很高兴认识你。",kind:"人称代词 · am/is/are · 国籍",focus:"This is… 介绍人物；I / you / he / she；be 动词 am / is / are；国籍形容词。",explain:"从这一课开始由介绍物品转为介绍人物。This is… 可以介绍某个人；之后用 he（他）或 she（她）继续说。I 配 am，you 配 are，he / she 配 is。国籍词通常放在 be 动词后面，且首字母大写。",form:"I am … .（我是……）\nYou are … .（你是……）\nHe is … .（他是……）\nShe is … .（她是……）\nThis is … .（这位是……）\nI'm = I am；He's = He is；She's = She is。",pattern:"This is … . He / She is … . I am … .",examples:[["This is Miss Sophie Dupont.","这位是索菲·杜邦小姐。","This is… 用来介绍眼前的人。"],["She is a new student. She is French.","她是一名新学生。她是法国人。","She 搭配 is；French 表示法国的/法国人。"],["I am Chinese. He is German.","我是中国人。他是德国人。","I 配 am；he 配 is。国籍词首字母大写。"]],words:[["meet","认识；遇见","Nice to meet you."],["new","新的","She is a new student."],["student","学生","I am a student."],["French","法国的；法国人","She is French."],["German","德国的；德国人","He is German."],["Japanese","日本的；日本人","He is Japanese."],["Korean","韩国的；韩国人","She is Korean."],["Chinese","中国的；中国人","I am Chinese."],["Italian","意大利的；意大利人","He is Italian."]],mistake:"① I 必须大写。② I am，不能说 I is；She is，不能说 She are。\n③ 国籍形容词首字母通常大写：French、Chinese。\n④ This is 后面可以接人名或身份介绍。",quiz:[["选择：She (am / is / are) French.","is"],["缩写：He is a student.","He's a student."],["翻译：这位是我的新老师。","This is my new teacher."]]},
{n:6,title:"What make is it?",cn:"它是什么牌子的？",kind:"What特殊疑问句 · a/an",focus:"What make is it?；What 引导的特殊疑问句；国家/国籍形容词；形容词放在名词前。",explain:"What make…? 是询问“什么牌子/什么品牌的？”。回答可以用 It's a + 形容词 + 名词。英语中形容词通常放在名词前面，例如 a French car（一辆法国汽车）。a / an 要根据后面单词的发音来选。",form:"What make is it?（它是什么牌子的？）\nIt's a French car.（它是一辆法国汽车。）\na French car；an English car。\na / an 看后面单词开头的发音。",pattern:"What make is it? — It's a … car.",examples:[["What make is it? — It's a French car.","它是什么牌子的？——它是一辆法国汽车。","What make…? 询问品牌/制造商。"],["It's an English car.","它是一辆英国汽车。","English 以元音音素开头，用 an。"],["Is it a Japanese car? — Yes, it is.","它是一辆日本汽车吗？——是的。","一般疑问句把 is 提到主语前。"]],words:[["make","品牌；制造商","What make is it?"],["American","美国的；美国人","It's an American car."],["English","英国的；英语的","It's an English car."],["French","法国的；法语的","It's a French car."],["German","德国的；德语的","It's a German car."],["Italian","意大利的；意大利语的","It's an Italian car."],["Japanese","日本的；日语的","It's a Japanese car."],["car","汽车","This is a car."],["beautiful","漂亮的","It's a beautiful car."],["expensive","昂贵的","It's an expensive car."]],mistake:"① 语序是 What make is it? 不要写成 What is make it?\n② 形容词放名词前：a French car。\n③ a / an 看发音：a French car；an English car。",quiz:[["补全：What make ____ it?","is"],["翻译：它是一辆德国汽车。","It's a German car."],["选择：a / an English car","an"]]},
{n:7,title:"Are you a teacher?",cn:"你是教师吗？",kind:"Are you…? · 简短回答",focus:"Are you…?；be 动词 are 的一般疑问句；you / I；否定回答；a / an。",explain:"把前面学过的 Is this…? 换成询问人的 Are you…?。you 要搭配 are，所以问句是 Are you…? 回答自己时，you 要换成 I：Yes, I am. / No, I'm not。",form:"陈述句：You are a teacher.\n一般疑问句：Are you a teacher?\n肯定回答：Yes, I am.\n否定回答：No, I'm not.\n记忆：I am；you are；he / she / it is。",pattern:"Are you …? — Yes, I am. / No, I'm not.",examples:[["Are you a teacher? — No, I'm not.","你是一名教师吗？——不，我不是。","Are + you…?；回答时用 I。"],["Are you French? — Yes, I am.","你是法国人吗？——是的。","you 搭配 are；回答 I 搭配 am。"],["Is he a student? — Yes, he is.","他是一名学生吗？——是的。","he 搭配 is，回答也用 he。"]],words:[["teacher","教师","Are you a teacher?"],["engineer","工程师","He is an engineer."],["policeman","男警察","He is a policeman."],["policewoman","女警察","She is a policewoman."],["keyboard operator","键盘操作员","She is a keyboard operator."],["nurse","护士","She is a nurse."],["hairdresser","理发师","He is a hairdresser."],["mechanic","机械师","He is a mechanic."],["housewife","家庭主妇","She is a housewife."],["postman","邮递员","He is a postman."]],mistake:"① Are you…? 回答时说 Yes, I am，不说 Yes, you are。\n② No, I'm not 是常见简短否定回答。\n③ engineer 以元音音素开头：an engineer。",quiz:[["补全：Are you a teacher? — Yes, ____ ____.","I am"],["把 You are a nurse. 改成一般疑问句。","Are you a nurse?"],["选择：a / an engineer","an"]]},
{n:8,title:"What's your job?",cn:"你是做什么工作的？",kind:"What's…? · 职业 · a/an",focus:"What's your job?；What is 缩写；职业表达；a / an；he / she。",explain:"What's 是 What is 的缩写。What's your job? 就是问“你的工作是什么？”。回答用 I'm a… 或 I'm an…。职业名称通常是可数名词单数，前面一般要有 a 或 an。",form:"What's your job?（你的工作是什么？）\nI'm a teacher.（我是一名教师。）\nI'm an engineer.（我是一名工程师。）\nHe's a mechanic. / She's a nurse。",pattern:"What's your job? — I'm a / an … .",examples:[["What's your job? — I'm a teacher.","你的工作是什么？——我是一名教师。","What's = What is；I'm = I am。"],["He's an engineer.","他是一名工程师。","engineer 以元音音素开头，用 an。"],["She's a nurse.","她是一名护士。","nurse 以辅音音素开头，用 a。"]],words:[["job","工作；职业","What's your job?"],["sales rep","销售代表","He's a sales rep."],["assistant","助手；助理","She is an assistant."],["customs officer","海关官员","He is a customs officer."],["office assistant","办公室助理","She's an office assistant."],["air hostess","空中乘务员","She is an air hostess."],["postman","邮递员","He's a postman."],["mechanic","机械师","He's a mechanic."],["hairdresser","理发师","She's a hairdresser."],["nurse","护士","I'm a nurse."]],mistake:"① What's = What is，不要和 Who's（Who is）混淆。\n② job 问职业，回答常用 I'm a/an + 职业。\n③ a / an 看发音：a teacher、an engineer、an air hostess。",quiz:[["翻译：你的工作是什么？","What's your job?"],["补全：I'm ____ engineer.","an"],["把 She is a nurse. 缩写。","She's a nurse."]]},
{n:9,title:"How are you today?",cn:"你今天好吗？",kind:"How特殊疑问句 · 状态表达",focus:"How 引导的特殊疑问句；be 动词与形容词；very / well / fine；And you?。",explain:"How are you? 是问“你怎么样？”，how 在这里询问状态。回答可以说 I'm fine.、I'm very well. 等。very 放在形容词或副词前，表示“很、非常”。And you? 就是“你呢？”。",form:"How + be 动词 + 主语？\nHow are you?（你好吗？）\nI'm + 状态表达.\nvery + well / good / fine。\nAnd you? = And how are you?（省略说法）",pattern:"How are you today? — I'm fine / very well, thank you. And you?",examples:[["How are you today? — I'm very well, thank you.","你今天好吗？——我很好，谢谢你。","How are you? 询问身体或近况。"],["I'm fine, thank you. And you?","我很好，谢谢。你呢？","And you? 承接前一句，反问对方。"],["Not too bad. I'm fine.","还不错。我很好。","Not too bad 是日常口语：还不错。"]],words:[["how","怎样；如何","How are you?"],["today","今天","How are you today?"],["well","好；健康地","I'm very well."],["fine","很好；不错","I'm fine."],["thanks","谢谢","Thanks!"],["thank you","谢谢你","Thank you very much."],["good","好的","I'm good."],["bad","坏的；糟糕的","Not too bad."],["too","也；太","Me too."],["and","和；而且；那么","And you?"]],mistake:"① How are you? 不是一般疑问句，不能只回答 Yes / No。\n② well 常表示身体或状态好；good 常作形容词。\n③ today 放句尾很自然：How are you today?",quiz:[["补全：How ____ you today?","are"],["翻译：我很好，谢谢。你呢？","I'm fine, thank you. And you?"],["very 的意思：A. 有一点 B. 非常","B. 非常"]]},
{n:10,title:"Look at…",cn:"看……",kind:"祈使句 · look at · he/she",focus:"Look at…；祈使句；动词原形开头；he / she / it；形容词作表语或放在名词前。",explain:"Look at… 是“看……”。Look 放在句首，直接用动词原形，表示让对方做一件事，这叫祈使句。that man 是“那位男士”；后面用 he 代替 man，避免重复。可以说 He is tall，也可以说 He is a tall man。",form:"祈使句：动词原形 + 其他。Look! / Look at that man.\nLook at + 人/物。（看……）\nHe is + 形容词。（他……）\nHe is + a/an + 形容词 + 名词。（他是一位……的……）",pattern:"Look at that man. He's tall. He's a policeman.",examples:[["Look at that man!","看那位男士！","祈使句：动词原形 Look 放句首。"],["He's tall. He's a policeman.","他很高。他是一名警察。","He's = He is；描述男性用 he。"],["Look at that woman. She's a nurse.","看那位女士。她是一名护士。","女性用 she；Look at 后面接名词。"]],words:[["look","看","Look at that man."],["at","在；向（此处与 look 搭配）","Look at me."],["man","男人；男士","That man is tall."],["woman","女人；女士","That woman is young."],["tall","高的","He's tall."],["short","矮的；短的","She's short."],["thin","瘦的","He's thin."],["fat","胖的","The dog is fat."],["dirty","脏的","His shoes are dirty."],["clean","干净的","The room is clean."],["busy","忙的","She's busy."],["lazy","懒惰的","He's lazy."],["policeman","男警察","He's a policeman."],["policewoman","女警察","She's a policewoman."],["hairdresser","理发师","He's a hairdresser."]],mistake:"① Look at 后面要有对象：Look at that man. 单独提醒别人看，可以说 Look!\n② 祈使句通常不写 you 作主语，动词用原形。\n③ 男性用 he，女性用 she；物品通常用 it。\n④ tall man 中 tall 放名词前；He is tall 中 tall 放 be 动词后。",quiz:[["翻译：看那位男士！","Look at that man!"],["选择正确句子：A. Looks at me. B. Look at me.","B. Look at me."],["用 she 改写：He is a nurse.","She is a nurse."]]}
];
let selected=1;
const nav=document.getElementById('nav'),list=document.getElementById('list'),detail=document.getElementById('detail'),search=document.getElementById('search');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderNav(){nav.innerHTML=lessons.map(l=>'<button class="nav '+(l.n===selected?'active':'')+'" onclick="openLesson('+l.n+')">第 '+l.n+' 课 · '+esc(l.title)+'</button>').join('')}
function renderList(){let q=search.value.toLowerCase();let arr=lessons.filter(l=>(l.n+' '+l.title+' '+l.cn+' '+l.focus+' '+l.words.map(w=>w[0]).join(' ')).toLowerCase().includes(q));list.innerHTML=arr.length?arr.map(l=>'<button class="lesson '+(l.n===selected?'active':'')+'" onclick="openLesson('+l.n+')"><small>LESSON '+l.n+' · '+esc(l.kind)+'</small><b>'+esc(l.title)+'</b><span class="muted">'+esc(l.cn)+'<br>'+esc(l.focus)+'</span></button>').join(''):'<div class="empty">没有找到相关课程。</div>'}
function openLesson(n){selected=n;let l=lessons[n-1];renderNav();renderList();detail.innerHTML='<article class="panel"><span class="tag">LESSON '+n+' · '+esc(l.kind)+'</span><h2>L'+n+' · '+esc(l.title)+'</h2><div class="muted">'+esc(l.cn)+'</div><div class="cols"><div><section class="block"><h3>📘 本课核心语法</h3><p>'+esc(l.focus)+'</p></section><section class="block"><h3>💡 大白话讲解</h3><p>'+esc(l.explain)+'</p></section><section class="block"><h3>🧩 句型结构拆解</h3><div class="example"><div class="en">'+esc(l.pattern)+'</div></div><p style="white-space:pre-line">'+esc(l.form)+'</p></section><section class="block"><h3>✍️ 例句精讲</h3>'+l.examples.map(e=>'<div class="example"><div class="en">'+esc(e[0])+'</div><div class="zh">'+esc(e[1])+'</div><div class="grammar">语法句型：'+esc(e[2])+'</div></div>').join('')+'</section><section class="block"><h3>📝 本课自测</h3>'+l.quiz.map((q,i)=>'<details class="example"><summary>'+esc((i+1)+'. '+q[0])+'</summary><div class="answer">参考答案：'+esc(q[1])+'</div></details>').join('')+'</section></div><div><section class="block"><h3>📚 本课重点词汇</h3>'+l.words.map(w=>'<div class="word"><div class="wordrow"><b>'+esc(w[0])+'</b><span class="zh">'+esc(w[1])+'</span></div><div class="grammar">例句：'+esc(w[2])+'</div></div>').join('')+'</section><section class="block"><h3>⚠️ 容易出错的地方</h3><p style="white-space:pre-line">'+esc(l.mistake)+'</p></section><section class="block"><h3>🎯 建议学习步骤</h3><p>1. 先读懂英文例句和中文意思。</p><p>2. 圈出本课反复出现的句型。</p><p>3. 替换一个单词，自己说出新句子。</p><p>4. 遮住中文，再独立表达一次。</p></section><button class="btn" onclick="speak('+n+')">🔊 朗读本课标题</button></div></div></article>'}
function speak(n){if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(lessons[n-1].title))}}
search.addEventListener('input',renderList);document.getElementById('all').onclick=()=>{search.value='';renderList()};renderNav();renderList();openLesson(1);
</script></main></div></body></html>
