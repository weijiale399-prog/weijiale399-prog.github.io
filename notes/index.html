<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的笔记 · Personal Notes</title>
<style>
:root{--bg:#f5f6fa;--panel:#fff;--ink:#202638;--muted:#858da0;--line:#e8eaf1;--accent:#5669d8;--accent-soft:#eef0ff;--shadow:0 10px 35px rgba(35,45,80,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:290px minmax(0,1fr)}aside{background:#fff;border-right:1px solid var(--line);padding:24px 18px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:12px;padding:0 8px 12px}.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,#7c8cf5,#4e61cf);display:grid;place-items:center;color:white;font-size:23px;box-shadow:0 7px 18px #5669d833}.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:1px 0 0}.primary{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:12px 14px;font-weight:650;box-shadow:0 7px 15px #5669d82b}.primary:hover{filter:brightness(1.04)}.search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fafbfe;outline:none}.search:focus,textarea:focus,input:focus,select:focus{border-color:#a6afff;box-shadow:0 0 0 3px #5669d815;outline:none}.section-label{font-size:11px;letter-spacing:1px;color:#a0a6b5;font-weight:700;padding:4px 9px}.filters{display:grid;gap:4px}.filter{border:0;background:transparent;border-radius:10px;padding:9px 10px;text-align:left;color:#687086;display:flex;justify-content:space-between;align-items:center}.filter:hover,.filter.active{background:var(--accent-soft);color:var(--accent)}.count{font-size:12px;color:#a1a7b5}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:16px 5px 0;color:var(--muted);font-size:12px}.side-actions{display:flex;gap:8px;margin-top:10px}.subtle{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;color:#687086;font-size:12px}.main{min-width:0;padding:34px clamp(18px,4vw,58px);max-width:1200px;width:100%;margin:0 auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.eyebrow{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:1px}.topline h2{font-size:28px;letter-spacing:-.7px;margin:4px 0}.topline p{margin:0;color:var(--muted);font-size:13px}.save-status{font-size:12px;color:#16856b;background:#e8f8f2;border-radius:99px;padding:7px 11px;white-space:nowrap}.editor{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:clamp(18px,3vw,34px);min-height:590px}.editor-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.tag-select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:white;color:#687086}.icon-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;color:#737b8e}.icon-btn:hover,.subtle:hover{background:#f7f8fc}.title-input{width:100%;border:0;outline:0;font-size:clamp(24px,3vw,34px);font-weight:750;letter-spacing:-.8px;padding:8px 0 14px;color:var(--ink)}.title-input::placeholder{color:#c4c8d3}.note-body{width:100%;min-height:390px;resize:vertical;border:0;border-top:1px solid var(--line);border-radius:0;padding:22px 0 8px;outline:0;font-size:16px;line-height:1.9;color:#3d4558;background:transparent}.note-body:focus{box-shadow:none;border-color:var(--line)}.note-body::placeholder{color:#b3b8c5}.editor-footer{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:15px;color:var(--muted);font-size:12px}.footer-actions{display:flex;gap:8px}.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:430px;color:var(--muted)}.empty-icon{font-size:44px;margin-bottom:10px}.empty h3{color:var(--ink);margin:0 0 5px}.empty p{max-width:330px;margin:0 0 18px}.note-list{display:grid;gap:8px;max-height:45vh;overflow:auto}.note-item{padding:12px;border:1px solid transparent;border-radius:12px;cursor:pointer;min-width:0}.note-item:hover{background:#f8f9fd}.note-item.active{background:var(--accent-soft);border-color:#e0e4ff}.note-item-title{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.note-item-preview{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}.note-item-date{font-size:11px;color:#a1a7b5;margin-top:5px;display:flex;justify-content:space-between}.mobile-head{display:none}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#242a3a;color:white;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.hidden{display:none!important}
@media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:15px;gap:12px}.brand{padding-bottom:2px}.brand h1{font-size:16px}.primary{padding:10px 12px}.side-bottom{display:none}.section-label{padding-top:5px}.filters{display:flex;overflow-x:auto}.filter{white-space:nowrap;padding:8px 12px}.note-list{display:flex;max-height:none;overflow-x:auto;padding-bottom:3px}.note-item{min-width:155px;max-width:190px;border-color:var(--line)}.main{padding:22px 14px}.topline{margin-bottom:16px}.topline h2{font-size:24px}.editor{min-height:510px;padding:18px}.note-body{min-height:310px}.save-status{font-size:11px}.title-input{font-size:26px}}
</style>
</head>
<body>
<div class="layout">
<aside>
  <div class="brand"><div class="logo">✎</div><div><h1>我的笔记</h1><p>把想法，好好保存下来</p></div></div>
  <button class="primary" id="newNote">＋　新建笔记</button>
  <input class="search" id="search" placeholder="⌕　搜索标题或内容…" autocomplete="off">
  <div><div class="section-label">笔记分类</div><div class="filters" id="filters"></div></div>
  <div><div class="section-label">最近笔记 <span id="noteCount"></span></div><div class="note-list" id="noteList"></div></div>
  <div class="side-bottom">🔒 笔记保存在当前浏览器中，不会上传到服务器。<div class="side-actions"><button class="subtle" id="exportBtn">导出备份</button><button class="subtle" id="importBtn">导入备份</button><input type="file" id="importFile" accept="application/json,.json" class="hidden"></div></div>
</aside>
<main class="main">
  <div class="topline"><div><div class="eyebrow">YOUR PERSONAL SPACE</div><h2 id="welcomeTitle">记录此刻的想法</h2><p id="welcomeSub">随手写下灵感、学习重点和生活中的小事。</p></div><div class="save-status" id="saveStatus">● 已在本地保存</div></div>
  <section class="editor" id="editor">
    <div class="empty" id="empty"><div class="empty-icon">🗒️</div><h3>这里还没有笔记</h3><p>新建一篇笔记，记录你的第一个想法。之后再次打开这个网页，笔记会留在这台设备的浏览器里。</p><button class="primary" id="emptyNew">＋ 创建第一篇笔记</button></div>
    <div id="editArea" class="hidden">
      <div class="editor-top"><div class="meta"><select class="tag-select" id="category" aria-label="笔记分类"><option>📚 学习</option><option>💡 灵感</option><option>🧺 生活</option><option>💼 工作</option><option>📌 待办</option><option>🗂️ 其他</option></select><span id="updatedAt" style="font-size:12px;color:#9aa1b1"></span></div><button class="icon-btn" id="deleteBtn">🗑 删除笔记</button></div>
      <input class="title-input" id="noteTitle" placeholder="给这篇笔记起个标题…" maxlength="180">
      <textarea class="note-body" id="noteBody" placeholder="开始记录吧…&#10;&#10;可以记下今天学到的知识、待办事项，或者突然想到的好点子。"></textarea>
      <div class="editor-footer"><span id="wordCount">0 个字</span><div class="footer-actions"><button class="icon-btn" id="copyBtn">复制内容</button><button class="primary" id="saveBtn">保存笔记</button></div></div>
    </div>
  </section>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
const KEY='personal-notes-v1';
const categories=['全部笔记','📚 学习','💡 灵感','🧺 生活','💼 工作','📌 待办','🗂️ 其他'];
let notes=[], currentId=null, activeCategory='全部笔记', query='', saveTimer=null;
const $=id=>document.getElementById(id);
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');notes=Array.isArray(v)?v:[]}catch(e){notes=[]}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes));$('saveStatus').textContent='● 已在本地保存';$('saveStatus').style.background='#e8f8f2';$('saveStatus').style.color='#16856b'}catch(e){$('saveStatus').textContent='保存失败：浏览器空间可能不足';$('saveStatus').style.background='#fff0ee';$('saveStatus').style.color='#b94c43'}}
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}
function dateLabel(iso){if(!iso)return'';const d=new Date(iso);if(isNaN(d))return'';return d.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'})+' '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
function activeNote(){return notes.find(n=>n.id===currentId)}
function filtered(){return notes.filter(n=>(activeCategory==='全部笔记'||n.category===activeCategory)&&(!query||(n.title+' '+n.body).toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>b.updated.localeCompare(a.updated))}
function renderFilters(){const counts={};notes.forEach(n=>counts[n.category]=(counts[n.category]||0)+1);$('filters').innerHTML='';categories.forEach(c=>{const b=document.createElement('button');b.className='filter'+(activeCategory===c?' active':'');b.innerHTML='<span></span><span class="count"></span>';b.firstChild.textContent=c;b.lastChild.textContent=c==='全部笔记'?notes.length:(counts[c]||0);b.onclick=()=>{activeCategory=c;renderFilters();renderList()};$('filters').appendChild(b)})}
function renderList(){const list=$('noteList'),arr=filtered();list.innerHTML='';$('noteCount').textContent='('+arr.length+')';if(!arr.length){const p=document.createElement('div');p.style.cssText='font-size:12px;color:#a0a6b5;padding:8px';p.textContent=query?'没有找到相关笔记':'还没有笔记';list.appendChild(p);return}arr.forEach(n=>{const b=document.createElement('div');b.className='note-item'+(n.id===currentId?' active':'');const title=document.createElement('div');title.className='note-item-title';title.textContent=n.title||'无标题笔记';const preview=document.createElement('div');preview.className='note-item-preview';preview.textContent=(n.body||'还没有内容').replace(/\s+/g,' ');const date=document.createElement('div');date.className='note-item-date';const cat=document.createElement('span');cat.textContent=n.category.replace(/^\S+\s/, '');const dt=document.createElement('span');dt.textContent=dateLabel(n.updated);date.append(cat,dt);b.append(title,preview,date);b.onclick=()=>openNote(n.id);list.appendChild(b)})}
function showEditor(show){$('empty').classList.toggle('hidden',show);$('editArea').classList.toggle('hidden',!show)}
function updateCount(){const s=$('noteBody').value;$('wordCount').textContent=s.length+' 个字 · '+s.split(/\s+/).filter(Boolean).length+' 个词'}
function openNote(id){flush();currentId=id;const n=activeNote();if(!n){showEditor(false);return}showEditor(true);$('noteTitle').value=n.title;$('noteBody').value=n.body;$('category').value=n.category;$('updatedAt').textContent='更新于 '+dateLabel(n.updated);$('welcomeTitle').textContent=n.title||'正在编辑笔记';$('welcomeSub').textContent='内容会自动保存在当前浏览器中。';updateCount();renderList()}
function newNote(){flush();const now=new Date().toISOString();const n={id:String(Date.now())+'-'+Math.random().toString(36).slice(2,7),title:'',body:'',category:activeCategory==='全部笔记'?'📚 学习':activeCategory,created:now,updated:now};notes.unshift(n);currentId=n.id;persist();renderFilters();renderList();openNote(n.id);$('noteTitle').focus();toast('新笔记已创建')}
function flush(){if(!currentId)return;const n=activeNote();if(!n)return;n.title=$('noteTitle').value;n.body=$('noteBody').value;n.category=$('category').value;n.updated=new Date().toISOString();persist();$('updatedAt').textContent='更新于 '+dateLabel(n.updated);$('welcomeTitle').textContent=n.title||'正在编辑笔记';updateCount();renderFilters();renderList()}
function scheduleSave(){ $('saveStatus').textContent='● 正在保存…';$('saveStatus').style.background='#fff6df';$('saveStatus').style.color='#986d13';clearTimeout(saveTimer);saveTimer=setTimeout(flush,250)}
function deleteCurrent(){const n=activeNote();if(!n)return;if(!confirm('确定删除这篇笔记吗？删除后无法从网页中恢复。建议先导出备份。'))return;notes=notes.filter(x=>x.id!==currentId);currentId=null;persist();renderFilters();renderList();showEditor(false);$('welcomeTitle').textContent='记录此刻的想法';$('welcomeSub').textContent='随手写下灵感、学习重点和生活中的小事。';toast('笔记已删除')}
function exportNotes(){flush();const blob=new Blob([JSON.stringify({app:'我的笔记',version:1,exportedAt:new Date().toISOString(),notes},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='我的笔记备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);toast('备份文件已导出')}
function importNotes(file){const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);const incoming=Array.isArray(data)?data:data.notes;if(!Array.isArray(incoming))throw Error('格式不正确');if(!confirm('导入 '+incoming.length+' 篇笔记？同 ID 的笔记将以导入内容为准。'))return;const map=new Map(notes.map(n=>[n.id,n]));incoming.forEach(n=>{if(n&&n.id)map.set(String(n.id),{id:String(n.id),title:String(n.title||''),body:String(n.body||''),category:categories.includes(n.category)?n.category:'🗂️ 其他',created:n.created||new Date().toISOString(),updated:n.updated||new Date().toISOString()})});notes=[...map.values()].sort((a,b)=>b.updated.localeCompare(a.updated));persist();currentId=notes[0]?.id||null;renderFilters();renderList();if(currentId)openNote(currentId);else showEditor(false);toast('备份导入成功')}catch(e){alert('导入失败：请选择本网页导出的 JSON 备份文件。')}};reader.readAsText(file)}
$('newNote').onclick=newNote;$('emptyNew').onclick=newNote;$('search').addEventListener('input',e=>{query=e.target.value;renderList()});$('noteTitle').addEventListener('input',scheduleSave);$('noteBody').addEventListener('input',()=>{updateCount();scheduleSave()});$('category').addEventListener('change',scheduleSave);$('saveBtn').onclick=()=>{flush();toast('笔记已保存')};$('deleteBtn').onclick=deleteCurrent;$('exportBtn').onclick=exportNotes;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{if(e.target.files[0])importNotes(e.target.files[0]);e.target.value=''};$('copyBtn').onclick=async()=>{const n=activeNote();if(!n)return;const text=(n.title?n.title+'\n\n':'')+n.body;try{await navigator.clipboard.writeText(text);toast('已复制到剪贴板')}catch(e){$('noteBody').select();document.execCommand('copy');toast('已尝试复制内容')}};window.addEventListener('beforeunload',flush);
load();renderFilters();renderList();if(notes.length){openNote(notes.sort((a,b)=>b.updated.localeCompare(a.updated))[0].id)}else showEditor(false);
})();
</script>
</body></html>
